<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact</title>
  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/section.css" />
  <link rel="stylesheet" href="css/work.css" />
</head>
<body>
  <main class="page">
    <div class="inner">

      <div class="header-row">
        <div class="breadcrumb">
          <a href="index.html" class="hi-logo" aria-label="Home">
            <img src="images/hi.svg" alt="hi" />
          </a>
          <span class="breadcrumb-slash">/</span>
          <img class="breadcrumb-img" src="images/contact.png"
            data-light="images/contact.png" data-dark="images/contact_dark.png" alt="contact" />
        </div>
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">dark</button>
      </div>

      <div class="contact-icons">
        <a href="mailto:arjun.ajjampur@gmail.com" class="contact-icon-item">
          <img src="images/contact/mail.png"
            data-light="images/contact/mail.png"
            data-dark="images/contact/mail_dark.png"
            alt="Email" />
          <span class="contact-icon-label">Mail</span>
        </a>
        <a href="https://www.linkedin.com/in/arjunajjampur/" target="_blank" rel="noreferrer" class="contact-icon-item">
          <img src="images/contact/linkedin.png"
            data-light="images/contact/linkedin.png"
            data-dark="images/contact/linkedin_dark.png"
            alt="LinkedIn" />
          <span class="contact-icon-label">LinkedIn</span>
        </a>
        <a href="resume.html" class="contact-icon-item">
          <img src="images/contact/resume.png"
            data-light="images/contact/resume.png"
            data-dark="images/contact/resume_dark.png"
            alt="Resume" />
          <span class="contact-icon-label">Resume</span>
        </a>
      </div>

    </div>
  </main>

  <footer class="footer">
    <hr class="footer-divider" />
    <div class="footer-inner">
      <div class="footer-logo footer-logo--figma">
        <img src="images/figma-logo-svgrepo-com.svg" alt="Figma" />
      </div>
      <span class="footer-plus">+</span>
      <div class="footer-logo footer-logo--claude">
        <img src="images/claude.png" alt="Claude" />
      </div>
      <span class="footer-sep">|</span>
      <span class="footer-year">2027</span>
    </div>
  </footer>

  <script src="js/theme.js"></script>
</body>
</html>
