<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play</title>
  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/section.css" />
  <link rel="stylesheet" href="css/work.css" />
</head>
<body>
  <main class="page">
    <div class="inner">

      <div class="header-row">
        <div class="breadcrumb">
          <a href="index.html" class="hi-logo" aria-label="Home">
            <img src="images/hi.svg" alt="hi" />
          </a>
          <span class="breadcrumb-slash">/</span>
          <img class="breadcrumb-img" src="images/play.png"
            data-light="images/play.png" data-dark="images/play_dark.png" alt="play" />
        </div>
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">dark</button>
      </div>

      <div class="work-intro">
        <div class="work-list">
          <a href="play/3d.html" class="work-item">
            <div class="work-item-header">
              <span class="work-item-title">3D Modeling</span>
              <div class="work-item-tags">
                <span class="work-item-tag">3D</span>
                <span class="work-item-tag">CAD</span>
                <span class="work-item-tag">Visualization</span>
              </div>
            </div>
            <p class="work-item-desc">A curation of 3D models built using polygons, NURBS, and rendering techniques.</p>
          </a>
          <a href="play/2d.html" class="work-item work-list-last">
            <div class="work-item-header">
              <span class="work-item-title">Illustration</span>
              <div class="work-item-tags">
                <span class="work-item-tag">Illustration</span>
                <span class="work-item-tag">Sketching</span>
              </div>
            </div>
            <p class="work-item-desc">Sketching and marker work, mostly on iPad using Procreate.</p>
          </a>
        </div>
      </div>

    </div>
  </main>

  <footer class="footer">
    <hr class="footer-divider" />
    <div class="footer-inner">
      <div class="footer-logo footer-logo--figma">
        <img src="images/figma-logo-svgrepo-com.svg" alt="Figma" />
      </div>
      <span class="footer-plus">+</span>
      <div class="footer-logo footer-logo--claude">
        <img src="images/claude.png" alt="Claude" />
      </div>
      <span class="footer-sep">|</span>
      <span class="footer-year">2027</span>
    </div>
  </footer>

  <script src="js/theme.js"></script>
</body>
</html>
